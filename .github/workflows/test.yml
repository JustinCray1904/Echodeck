name: Tests

# Runs the unit tests on every push and pull request, on Windows because Tempo is a WPF application
# (the test project targets net8.0-windows and cannot run on Linux). Fast: no installer is built here.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test (TRX report + coverage)
        run: >
          dotnet test EchoDeck.Tests/EchoDeck.Tests.csproj -c Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

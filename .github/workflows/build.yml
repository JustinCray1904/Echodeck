name: Build EchoDeck

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the installer to a GitHub Release on version tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project files
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter EchoDeck.csproj | Select-Object -First 1
          if (-not $proj) { throw "EchoDeck.csproj was not found in the repository." }
          $iss = Get-ChildItem -Recurse -Filter EchoDeck.iss | Select-Object -First 1
          if (-not $iss) { throw "installer/EchoDeck.iss was not found in the repository." }
          $icon = Join-Path $proj.DirectoryName 'Assets\app.ico'
          if (-not (Test-Path $icon)) { throw "Assets\app.ico is missing next to the project file." }
          "PROJECT=$($proj.FullName)"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROJECT_DIR=$($proj.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ISS_FILE=$($iss.FullName)"          | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ICON_FILE=$icon"                    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$xml = Get-Content $env:PROJECT
            $ver = $xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
            if (-not $ver) { $ver = '2.0.0' }
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $ver"

      # 1) Restore also downloads LibVLCSharp and the VideoLAN.LibVLC.Windows (libvlc.dll) NuGet packages
      - name: Restore
        run: dotnet restore "${{ env.PROJECT }}" -r win-x64

      # 2) Publish: x64, self-contained, ONE compressed exe. The csproj also strips the unused parts of LibVLC
      #    (Qt GUI, Lua, stream-out, locales, encoders) after publish to keep the download small.
      - name: Publish (self-contained, win-x64, single file)
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT" -c Release -r win-x64 --self-contained true `
            "-p:Version=$($env:APP_VERSION)" `
            -o "$env:GITHUB_WORKSPACE\publish"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      # 3) Native architecture check: LibVLC must be the x64 build and sit in publish\libvlc\win-x64
      - name: Verify LibVLC native files
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'publish'
          $dll = Join-Path $pub 'libvlc\win-x64\libvlc.dll'

          if (-not (Test-Path $dll)) {
            Write-Warning "libvlc is missing from the publish output; copying it from the NuGet package."
            $cache = ((dotnet nuget locals global-packages -l) -replace '^global-packages:\s*', '').Trim()
            $src = Get-ChildItem (Join-Path $cache 'videolan.libvlc.windows') -Recurse -Filter libvlc.dll -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
            if (-not $src) { throw "libvlc.dll (x64) was not found in the NuGet package cache." }
            $dest = Join-Path $pub 'libvlc\win-x64'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item (Join-Path $src.DirectoryName '*') $dest -Recurse -Force
          }

          foreach ($p in 'EchoDeck.exe', 'libvlc\win-x64\libvlc.dll', 'libvlc\win-x64\libvlccore.dll', 'libvlc\win-x64\plugins') {
            if (-not (Test-Path (Join-Path $pub $p))) { throw "Missing from publish output: $p" }
          }

          # PE header check: 0x8664 = x64. An x86 libvlc.dll would crash with a DllNotFoundException / BadImageFormat.
          $bytes = [System.IO.File]::ReadAllBytes($dll)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw ("libvlc.dll is not x64 (machine type 0x{0:X})" -f $machine) }
          Write-Host "LibVLC natives present and x64."

          $mb = [math]::Round(((Get-ChildItem $pub -Recurse -File | Measure-Object Length -Sum).Sum) / 1MB, 1)
          Write-Host "Publish folder size: $mb MB"
          Get-ChildItem $pub -File | Sort-Object Length -Descending | Select-Object -First 5 Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table | Out-String | Write-Host

      # 4) Compile the installer with Inno Setup (LZMA2 ultra)
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe (Inno Setup compiler) was not found." }

          & $iscc "/DAppVersion=$($env:APP_VERSION)" "/DSourceDir=$($env:GITHUB_WORKSPACE)\publish" `
                  "/DIconFile=$($env:ICON_FILE)" "/O$($env:GITHUB_WORKSPACE)\installer-output" "$($env:ISS_FILE)"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

          Get-ChildItem "$env:GITHUB_WORKSPACE\installer-output" | ForEach-Object {
            Write-Host ("{0}: {1} MB" -f $_.Name, [math]::Round($_.Length/1MB,1))
          }

      # Portable zip only for releases (keeps normal CI artifacts small)
      - name: Create portable zip (release tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" -CompressionLevel Optimal `
            -DestinationPath "$env:GITHUB_WORKSPACE\installer-output\EchoDeck-portable-$($env:APP_VERSION).zip"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EchoDeck-${{ env.APP_VERSION }}
          path: installer-output/*
          compression-level: 0     # already compressed
          if-no-files-found: error

      - name: Attach to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*
          generate_release_notes: true

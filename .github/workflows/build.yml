name: Build installer

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the installer to a GitHub Release on version tags

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Locate project files
        shell: pwsh
        run: |
          $proj = Get-ChildItem -Recurse -Filter DeefxultMediaPlayer.csproj | Select-Object -First 1
          if (-not $proj) { throw "DeefxultMediaPlayer.csproj was not found in the repository." }
          $iss = Get-ChildItem -Recurse -Filter DeefxultMediaPlayer.iss | Select-Object -First 1
          if (-not $iss) { throw "installer/DeefxultMediaPlayer.iss was not found in the repository." }
          $icon = Join-Path $proj.DirectoryName 'Assets\app.ico'
          if (-not (Test-Path $icon)) { throw "Assets\app.ico is missing next to the project file." }
          "PROJECT=$($proj.FullName)"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROJECT_DIR=$($proj.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ISS_FILE=$($iss.FullName)"        | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ICON_FILE=$icon"                  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$xml = Get-Content $env:PROJECT
            $ver = $xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1
            if (-not $ver) { $ver = '1.0.0' }
          }
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version: $ver"

      # 1) .NET environment: restore also downloads the LibVLCSharp and VideoLAN.LibVLC.Windows (libvlc.dll) NuGet packages
      - name: Restore
        run: dotnet restore "${{ env.PROJECT }}" -r win-x64

      # 2) Compile + publish for x64; LibVLC natives must end up in publish\libvlc\win-x64 (verified in the next step)
      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT" -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false "-p:Version=$($env:APP_VERSION)" `
            -o "$env:GITHUB_WORKSPACE\publish"
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish failed" }

      - name: Verify LibVLC native files
        shell: pwsh
        run: |
          $pub = Join-Path $env:GITHUB_WORKSPACE 'publish'
          $dll = Join-Path $pub 'libvlc\win-x64\libvlc.dll'

          if (-not (Test-Path $dll)) {
            Write-Warning "libvlc is missing from the publish output; copying it from the NuGet package."
            $cache = ((dotnet nuget locals global-packages -l) -replace '^global-packages:\s*', '').Trim()
            $src = Get-ChildItem (Join-Path $cache 'videolan.libvlc.windows') -Recurse -Filter libvlc.dll -ErrorAction SilentlyContinue |
                   Where-Object { $_.FullName -match '[\\/]x64[\\/]' } | Select-Object -First 1
            if (-not $src) { throw "libvlc.dll (x64) was not found in the NuGet package cache." }
            $dest = Join-Path $pub 'libvlc\win-x64'
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            Copy-Item (Join-Path $src.DirectoryName '*') $dest -Recurse -Force
          }

          foreach ($p in 'DeefxultMediaPlayer.exe', 'libvlc\win-x64\libvlc.dll', 'libvlc\win-x64\libvlccore.dll', 'libvlc\win-x64\plugins') {
            if (-not (Test-Path (Join-Path $pub $p))) { throw "Missing from publish output: $p" }
          }
          Write-Host "LibVLC natives present."

      # 3) Compile the installer with iscc.exe (Inno Setup compiler)
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe (Inno Setup compiler) was not found." }

          & $iscc "/DAppVersion=$($env:APP_VERSION)" "/DSourceDir=$($env:GITHUB_WORKSPACE)\publish" `
                  "/DIconFile=$($env:ICON_FILE)" "/O$($env:GITHUB_WORKSPACE)\installer-output" "$($env:ISS_FILE)"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Create portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\publish\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\installer-output\DeefxultMediaPlayer-portable-$($env:APP_VERSION).zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeefxultMediaPlayer-${{ env.APP_VERSION }}
          path: installer-output/*
          if-no-files-found: error

      - name: Attach to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-output/*
          generate_release_notes: true

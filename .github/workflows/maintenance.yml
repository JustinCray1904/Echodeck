name: Maintenance

# One-off chores that normally need the .NET SDK on your own computer. Run them from the Actions tab:
# Actions > Maintenance > Run workflow > pick a task. Each task makes ONE separate commit on the branch you run it on.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        options:
          - lock-files
          - solution-file
          - format

permissions:
  contents: write

jobs:
  run:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # packages.lock.json for both projects (the app is restored for win-x64, exactly like build.yml does)
      - name: Create lock files
        if: inputs.task == 'lock-files'
        shell: pwsh
        run: |
          dotnet restore EchoDeck/EchoDeck.csproj -r win-x64 --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw "restore of EchoDeck failed" }
          dotnet restore EchoDeck.Tests/EchoDeck.Tests.csproj --force-evaluate
          if ($LASTEXITCODE -ne 0) { throw "restore of EchoDeck.Tests failed" }

      - name: Create the solution file
        if: inputs.task == 'solution-file'
        shell: pwsh
        run: |
          dotnet new sln -n EchoDeck
          dotnet sln EchoDeck.sln add EchoDeck/EchoDeck.csproj EchoDeck.Tests/EchoDeck.Tests.csproj

      - name: Format the code
        if: inputs.task == 'format'
        shell: pwsh
        run: |
          dotnet format EchoDeck/EchoDeck.csproj
          dotnet format EchoDeck.Tests/EchoDeck.Tests.csproj

      - name: Commit the result
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git status --porcelain) {
            git commit -m "chore: ${{ inputs.task }} (made by the Maintenance workflow)"
            git push
          } else {
            Write-Host "Nothing changed: nothing to commit."
          }
